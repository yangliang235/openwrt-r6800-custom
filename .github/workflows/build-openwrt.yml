name: Build OpenWrt for R6800

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            dl
            feeds
          key: ${{ runner.os }}-openwrt-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-multilib g++-multilib flex bison gawk libncurses-dev libssl-dev python3-distutils python3-setuptools zlib1g-dev swig rsync unzip wget ccache patch

      - name: Clone OpenWrt
        run: git clone --depth 1 https://github.com/openwrt/openwrt.git src

      - name: Update Feeds
        run: |
          cd src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install .config
        run: cp config/.config src/.config

      - name: Tweaks (Patches, Overclock, ZRAM with ZSTD, Sysctl, rc.local)
        run: |
          cd src
          # --- 1. 自定义补丁应用 ---
          if [ -d "../patches" ]; then
            echo "🚀 应用自定义补丁..."
            for patch_file in $(ls ../patches/*.patch); do
              echo "🔍 尝试应用: $patch_file"
              if patch -p1 --dry-run < "$patch_file" > /dev/null 2>&1; then
                patch -p1 < "$patch_file"
                echo "✅ $patch_file 应用成功 (p1)"
              elif patch -p0 --dry-run < "$patch_file" > /dev/null 2>&1; then
                patch -p0 < "$patch_file"
                echo "✅ $patch_file 应用成功 (p0)"
              else
                echo "❌ $patch_file 无法应用，跳过"
              fi
            done
          fi

          # --- 2. 超频 (1100MHz) ---
          echo "🔧 应用 MT7621 频率修改 (1100MHz)..."
          find target/linux/ramips/dts/ -name "mt7621_netgear_r6800.dts" -exec sed -i 's/clock-frequency = <880000000>/clock-frequency = <1100000000>/g' {} +
          find target/linux/ramips/dts/ -name "mt7621.dtsi" -exec sed -i 's/clock-frequency = <880000000>/clock-frequency = <1100000000>/g' {} +
          echo "⚠️ CPU 频率已修改为 1100MHz"

          # --- 3. ZRAM: ZSTD 内核依赖与软件包 ---
          echo "CONFIG_PACKAGE_kmod-zram=y" >> .config
          echo "CONFIG_PACKAGE_zram-swap=y" >> .config
          echo "CONFIG_PACKAGE_kmod-lib-zstd=y" >> .config
          echo "CONFIG_PACKAGE_zstd=y" >> .config
          echo "CONFIG_CRYPTO_ZSTD=y" >> .config
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> .config
          echo "CONFIG_BUSYBOX_CONFIG_MKSWAP=y" >> .config
          echo "CONFIG_BUSYBOX_CONFIG_SWAPON=y" >> .config
          echo "CONFIG_BUSYBOX_CONFIG_SWAPOFF=y" >> .config
          echo "✅ ZRAM 软件包与 ZSTD 依赖已配置"

          # --- 4. 运行时固化 ZRAM 大小与压缩算法 (核心修改) ---
          # zram-swap 从 uci system 配置中读取 zram_size_mb 和 zram_comp_algo。
          mkdir -p package/base-files/files/etc/uci-defaults/
          cat <<'UCI_EOF' > package/base-files/files/etc/uci-defaults/99-zram-config
          #!/bin/sh
          # 设置 ZRAM 压缩算法为 zstd
          uci set system.@system[0].zram_comp_algo='zstd'
          # 设置 ZRAM 大小 (单位: MB)。R6800 内存 256MB，128MB 约为内存一半，可按需调整。
          uci set system.@system[0].zram_size_mb='256'
          uci commit system
          exit 0
          UCI_EOF
          chmod +x package/base-files/files/etc/uci-defaults/99-zram-config
          echo "✅ 已添加 uci-defaults 脚本: zram_comp_algo=zstd, zram_size_mb=256"

          # --- 5. Sysctl 调优 ---
          mkdir -p package/base-files/files/etc/sysctl.d/
          cat <<'SYSCTL_EOF' > package/base-files/files/etc/sysctl.d/99-tuning.conf
          net.core.busy_read=50
          net.core.busy_poll=50
          net.core.netdev_max_backlog=16384
          net.core.optmem_max=65536
          net.core.rmem_default=16777216
          net.core.rmem_max=16777216
          net.core.wmem_default=16777216
          net.core.wmem_max=16777216
          net.core.somaxconn=4096
          net.ipv4.tcp_rmem=4096 87380 16777216
          net.ipv4.tcp_wmem=4096 65536 16777216
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_fin_timeout=10
          net.ipv4.tcp_keepalive_intvl=10
          net.ipv4.tcp_keepalive_probes=5
          net.ipv4.tcp_keepalive_time=600
          net.ipv4.tcp_max_syn_backlog=8192
          net.ipv4.tcp_max_tw_buckets=2000000
          net.ipv4.tcp_no_metrics_save=1
          net.ipv4.tcp_rfc1337=1
          net.ipv4.tcp_sack=1
          net.ipv4.tcp_fack=1
          net.ipv4.tcp_window_scaling=1
          net.ipv4.tcp_timestamps=0
          net.ipv4.tcp_mtu_probing=1
          net.ipv4.tcp_base_mss=1024
          net.ipv4.tcp_workaround_signed_windows=1
          net.ipv4.tcp_slow_start_after_idle=0
          net.ipv4.tcp_tw_reuse=1
          net.ipv4.ip_local_port_range=1024 65535
          net.ipv4.tcp_notsent_lowat=16384
          net.ipv4.tcp_limit_output_bytes=65536
          net.ipv4.tcp_challenge_ack_limit=999999
          net.ipv4.udp_rmem_min=16384
          net.ipv4.udp_wmem_min=16384
          vm.dirty_background_ratio=3
          vm.dirty_ratio=5
          vm.swappiness=198
          vm.vfs_cache_pressure=300
          fs.file-max=1000000
          net.ipv6.conf.all.disable_ipv6=0
          net.ipv6.conf.default.disable_ipv6=0
          net.netfilter.nf_conntrack_max=1048576
          net.netfilter.nf_conntrack_tcp_timeout_established=7440
          SYSCTL_EOF

          # --- 6. rc.local 优化 ---
          sed -i '/exit 0/d' package/base-files/files/etc/rc.local
          echo "echo 1000000 > /sys/class/net/eth0/queues/rx-0/rps_flow_cnt" >> package/base-files/files/etc/rc.local
          echo "for x in /sys/class/net/*/queues/rx-0/rps_cpus; do echo f > \$x; done" >> package/base-files/files/etc/rc.local
          echo "ethtool -K eth0 gro on gso on tso on ufo on" >> package/base-files/files/etc/rc.local
          echo "ethtool -C eth0 rx-usecs 0 tx-usecs 0" >> package/base-files/files/etc/rc.local
          echo "ethtool --set-eee eth0 eee off" >> package/base-files/files/etc/rc.local
          echo "exit 0" >> package/base-files/files/etc/rc.local

      - name: Enable MU-MIMO in Wireless Config
        run: |
          cd src
          WIRELESS_CONFIG="package/base-files/files/etc/config/wireless"
          mkdir -p $(dirname "$WIRELESS_CONFIG")
          cat > "$WIRELESS_CONFIG" <<'WIFI_EOF'
          config wifi-device 'radio0'
              option type 'mac80211'
              option channel '36'
              option hwmode '11a'
              option path 'pci0000:00/0000:00:00.0/0000:01:00.0'
              option htmode 'VHT80'
              option he_su_beamformer '1'
              option he_su_beamformee '1'
              option he_mu_beamformer '1'

          config wifi-device 'radio1'
              option type 'mac80211'
              option channel '6'
              option hwmode '11g'
              option path 'pci0000:00/0000:00:01.0/0000:02:00.0'
              option htmode 'HT40'
              option he_su_beamformer '1'
              option he_su_beamformee '1'
              option he_mu_beamformer '1'
          WIFI_EOF
          echo "✅ MU-MIMO 相关无线选项已注入出厂配置"

      - name: Run defconfig & Safety Check
        run: |
          cd src
          make config-clean 2>/dev/null || true
          make defconfig WARN_RECURSIVE_DEP=1

          grep "CONFIG_PACKAGE_kmod-mt7615e=y" .config || (echo "ERROR: Wi-Fi 驱动缺失!" && exit 1)
          grep "CONFIG_PACKAGE_kmod-zram=y" .config || (echo "ERROR: zram 内核模块缺失!" && exit 1)
          grep "CONFIG_PACKAGE_zram-swap=y" .config || (echo "ERROR: zram-swap 脚本缺失!" && exit 1)
          grep "CONFIG_PACKAGE_kmod-lib-zstd=y" .config || (echo "ERROR: zstd 内核库缺失!" && exit 1)
          grep "CONFIG_CRYPTO_ZSTD=y" .config || (echo "ERROR: CRYPTO_ZSTD 内核依赖缺失!" && exit 1)
          grep "CONFIG_ZRAM_DEF_COMP_ZSTD=y" .config || (echo "ERROR: zram 默认压缩算法未设为 zstd!" && exit 1)
          echo "✅ 所有关键配置检查通过 (ZRAM 使用 ZSTD, 大小由 uci-defaults 设定)"

      - name: Build firmware
        run: |
          cd src
          sed -i 's/ERROR/WARNING/g' package/kernel/linux/modules/*.mk
          make world -j$(nproc) OPKG_FLAGS="--force-overwrite" BUILD_LOG=1 CONFIG_PKG_OVERWRITE=y || make world -j1 V=s OPKG_FLAGS="--force-overwrite" BUILD_LOG=1 CONFIG_PKG_OVERWRITE=y

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-R6800
          path: src/bin/targets/ramips/mt7621/
